spring:
  datasource:
    url: jdbc:h2:mem:shortly;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  base-url: http://localhost:10004
  security:
    jwt:
      secret: test-only-shortly-jwt-secret-0123456789abcdef
  ads:
    enabled: false
